[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "zenmanage"
version = "1.0.1"
description = "Official Python SDK for Zenmanage feature flags with local evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Zenmanage", email = "hello@zenmanage.com" }
]
keywords = ["feature-flags", "feature-toggles", "ab-testing", "remote-config", "zenmanage"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "requests>=2.31.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/zenmanage/zenmanage-python"
Repository = "https://github.com/zenmanage/zenmanage-python"
Documentation = "https://github.com/zenmanage/zenmanage-python#readme"
Issues = "https://github.com/zenmanage/zenmanage-python/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "pytest-cov>=5.0.0",
  "requests-mock>=1.12.1",
  "types-requests>=2.32.0.20250602",
  "ruff>=0.6.0",
  "mypy>=1.11.1",
  "build>=1.2.1",
  "twine>=5.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zenmanage"]

[tool.pytest.ini_options]
addopts = "-q --cov=zenmanage --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["zenmanage"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N"]

# Bare `assert` is the standard pytest idiom (pytest rewrites asserts for rich
# failure output) and the suite is never run with -O, so B101 does not apply.
[tool.bandit]
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
mypy_path = "src"
